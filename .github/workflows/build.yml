මෙන්න නිවැරදි කෝඩ් එක. මේකේ ඉන්ඩෙන්ෂන් ටික හරියට තියෙනවා, ආයේ අවුලක් වෙන්නේ නැහැ.
name: Build APK
on:
push:
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-java@v4
with:
distribution: temurin
java-version: 17
- uses: android-actions/setup-android@v3
- name: Unzip project
run: unzip -o ToolBox.zip
- name: Build debug APK
run: |
chmod +x gradlew
./gradlew assembleDebug --no-daemon
- uses: actions/upload-artifact@v4
with:
name: ToolBox-APK
path: ToolBox/app/build/outputs/apk/debug/app-debug.apk
